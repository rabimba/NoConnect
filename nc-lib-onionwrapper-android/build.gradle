apply plugin: 'com.android.library'


// Vendored from org.briarproject:onionwrapper-android:0.1.7 (Maven Central sources jar and aar). Licence: GPL-3.0.

android {
	compileSdkVersion 35
	buildToolsVersion '35.0.0'

	defaultConfig {
		minSdkVersion 21
	}

	compileOptions {
		sourceCompatibility JavaVersion.VERSION_1_8
		targetCompatibility JavaVersion.VERSION_1_8
	}
	namespace 'org.briarproject.onionwrapper'
}

dependencies {
	api project(':nc-lib-onionwrapper-core')
	implementation project(':nc-lib-dontkillme')
}
