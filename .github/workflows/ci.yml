name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      # Avoid blocking on /dev/random in crypto tests
      JAVA_TOOL_OPTIONS: -Djava.security.egd=file:/dev/urandom
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.1.0'

      - uses: gradle/actions/setup-gradle@v4

      - name: Check for upstream names
        run: |
          # Attribution lives only in licence/notice files, docs and the rename tool;
          # the prebuilt Tor/lyrebird binary coordinates are the only allowed exception.
          if git ls-files | grep -v '^docs/\|^LICENSE$\|^NOTICE$\|^README.md$\|^CLAUDE.md$\|^tools/rename-upstream.py$\|^.github/' \
              | xargs grep -Iin 'briar\|bramble' | grep -v 'org\.briarproject:\(tor\|lyrebird\)-'; then
            echo "Found upstream names (see above)"; exit 1
          fi

      - name: API compatibility (Animal Sniffer)
        run: ./gradlew animalSnifferMain animalSnifferTest

      - name: Build
        run: ./gradlew assembleOfficialDebug :noconnect-headless:linuxJars

      - name: Lint and tests
        run: ./gradlew compileOfficialDebugAndroidTestSources compileScreenshotDebugAndroidTestSources check

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-reports
          path: '**/build/reports/'
          retention-days: 7

      - uses: actions/upload-artifact@v4
        with:
          name: noconnect-debug-apk
          path: noconnect-android/build/outputs/apk/official/debug/*.apk
          retention-days: 14
